name: Q UI Module focused tests
# Focused UI Module verification only.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --experimental-transform-types --test tests/p1/export/ui_module/client.test.ts tests/p1/export/ui_module/entry.test.ts tests/p1/ui_module/resolve_ui_module/handler.test.ts
